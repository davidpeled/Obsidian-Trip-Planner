name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Obsidian's review rules and the layering, with no warnings allowed.
      - run: npm run lint
      # Type-check, unit + architecture tests (incl. the startup budget), production bundle within its size budget.
      - run: npm run build
      # Nothing third-party in main.js, and no unexpected license among the dev tools.
      - run: npm run check:licenses
      - uses: actions/upload-artifact@v4
        with:
          name: trip-planner
          path: |
            main.js
            manifest.json
            styles.css
